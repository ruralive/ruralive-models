name: Build models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_models.py', '.github/workflows/build-models.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/build_models.py
      - run: curl -fsS https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt -o LICENSE
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models models.json CREDITS.md LICENSE
          git diff --cached --quiet || { git commit -m 'Update the built models'; git push; }
