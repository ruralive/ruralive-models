name: Build rigged models
on:
  workflow_dispatch:
  push:
    branches: [main, setfilm-rigged-models]
    paths: ['animations/**', '.github/workflows/build-rigged.yml']
permissions:
  contents: write
concurrency:
  group: rigged-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix animations
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: |
          node animations/decode.mjs "$RUNNER_TEMP/decoded"
          OPENBLAS_NUM_THREADS=1 python animations/build.py "$RUNNER_TEMP/decoded" "$RUNNER_TEMP/rigged"
          node animations/pack.mjs "$RUNNER_TEMP/rigged"
          mkdir -p rigged
          cp "$RUNNER_TEMP/rigged/"*.glb "$RUNNER_TEMP/rigged/manifest.json" rigged/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rigged
          git diff --cached --quiet || { git commit -m 'Publish self-contained rigged GLBs'; git push; }
